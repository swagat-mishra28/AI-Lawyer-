# Registry of every statute the assistant is ALLOWED to name.
# The citation guard (nyaya/guard.py) uses `aliases` to recognise an Act in model output.
# If the model names an Act that is not here, or a section of a listed Act that no
# retrieved knowledge entry backs, the guard treats it as unverified and removes it.
#
# `status` lets us handle repealed laws honestly (e.g. IPC -> BNS from 1 July 2024).

