- id: wage-multiturn
  title: Vague first message, details in second turn
  turns:
    - "my company is not paying me"
    - "I work in a small IT company in Chennai, salary 35,000 per month. They have not paid for August, September and October 2026. I am still working there. I have offer letter and old payslips."
  expect:
    category: wages
    deadline: true
    deadline_date: "2026-09-07"
    mention_any: [["1,05,000", "105,000", "105000", "1.05", "three months", "3 months"]]

- id: notice-cheque-bounce
  title: Received a cheque-bounce notice (notice explainer)
  notice_received: "2026-11-15"
  notice_language: Hinglish
  notice_text: |
    LEGAL NOTICE UNDER SECTION 138 OF THE NEGOTIABLE INSTRUMENTS ACT, 1881
    Date: 10.11.2026
    To, Mr. Ramesh Kumar, H.No. 45, Sector 12, Faridabad, Haryana
    Under instructions from my client Mr. Suresh Gupta, I serve you this notice. You issued cheque no. 004512
    dated 01.10.2026 for Rs. 1,50,000 drawn on State Bank of India towards repayment of a friendly loan. The said
    cheque was presented and returned unpaid with the remark "Funds Insufficient" vide return memo dated 28.10.2026.
    You are hereby called upon to pay the said amount of Rs. 1,50,000 within 15 days of receipt of this notice,
    failing which my client shall be constrained to file a criminal complaint under Section 138 read with Section 142
    of the Negotiable Instruments Act, 1881 against you, at your risk as to costs and consequences.
    Sd/- Advocate A. Sharma, District Courts, Faridabad
  expect:
    escalation: [lawyer_now]
    deadline: true
    deadline_date: "2026-11-30"
    mention_any: [["15"], ["1,50,000", "150000", "1.5 lakh", "1,50,000"]]

- id: notice-landlord-ipc
  title: Notice from landlord's lawyer citing IPC 406 (quoted law)
  notice_received: "2026-11-18"
  notice_language: English
  notice_text: |
    LEGAL NOTICE
    Date: 16/11/2026
    To: Ms. Priya Nair, Flat 3B, Green Apartments, Kochi
    On behalf of my client Mr. Thomas Varghese, owner of the above flat, I state that you vacated the flat on
    30/09/2026 leaving it damaged. Repairs cost Rs. 25,000 which exceeds your deposit of Rs. 20,000. You are called
    upon to pay Rs. 5,000 within 7 days, failing which my client will initiate civil and criminal proceedings
    against you including under Section 406 IPC for criminal breach of trust.
    Advocate K. Menon
  expect:
    no_escalation: false
    mention_any: [["7"], ["not a court order", "not an order", "not a court", "letter"]]

