- id: con-time-barred
  title: Consumer complaint after 2-year limit
  turns:
    - "I bought a washing machine for 30,000 in March 2023 and it stopped working in April 2023. The company never fixed it. Can I file a consumer case now?"
  expect:
    category: consumer
    escalation: [lawyer_now]
    mention_any: [["2 years", "two years", "time limit", "delay"]]

- id: con-builder-large
  title: Builder delay, Rs 85 lakh (state commission, large amount)
  turns:
